# 数据库连接jdbc url
user.db.url=jdbc:postgresql://127.0.0.1:26257/defaultdb
# 数据库连接用户
user.db.user=root
# 创建时时序库名称
user.db.name=db_shig
# 线程池大小
user.sys.conn_pool_size=20
# 生成数据时间戳间隔ms
user.sys.data_ts_step=1000
# 每个线程模拟设备数量
user.device.count_per_thread=50
# 起始设备编号,用于分布客户端创建
user.device.no_start=1
# 结束device编号
user.device.no_end=10
# 写入吞吐量/min
user.write.throughput=50000
# 插入样本数据文件
user.write.csv_sample_data=/data/data.csv
# 每个线程执行的数据写入次数
user.write.limit_per_thread=10000
# 写入持续时间,ISO8601时间格式-1表示不限制
user.write.duration=-1
# 写入终止时间,时间格式参照"yyyy-MM-dd HH:mm:ss.SSS", -1表示不限制
user.write.stop_at=-1
# 单次单表插入数据行数
user.write.lines=20
# 生成乱序数据时batch内部使用第几行与第0行交换的索引，从0开始
user.write.swap_line_idx=1
# 产生乱序数据的batch间隔，从1开始，设置为0则关闭乱序
user.write.disorder_batch_interval=0
# 写线程数量
user.write.thread_count=20
# 降采样参数
user.sys.down_sampling_param=RETENTIONS 180m\,360m:30s\,720m:1m SAMPLE avg\,last(elect_name)
# [Prepare] 配置执行次数
user.threadgroup.config.count=1
# [Prepare] 创建数据库执行次数
user.threadgroup.database.count=1
# [Prepare] 创建模板表执行次数
user.threadgroup.stable.count=1
# [Prepare] 创建表执行次数
user.threadgroup.table.count=1
# [Prepare] 执行数据写入执行次数
user.threadgroup.write.count=1
# [未知配置]
user.xxx.duration=120