conn_config:
  db_url: jdbc:kaiwudb://127.0.0.1:26257/defaultdb
  db_username: root
  db_password: ""
  conn_pool_size: 4
  device_start: 1
  test_duration: 300
write_config:
  - tbl_name: iot_monitor.t_cnc
    throughput: 1.0
    mode: prepare
    batch_lines: 5
    device_per_thread: 2
    num_threads: 4
pub_sub_config:
  publisher_db: iot_monitor
  publication_name: pub_iot
  subscription_name: sub_iot
  conninfo: postgresql://root@127.0.0.1:26257/iot_monitor?sslmode=disable
  options:
    target: '{"iot_monitor.public.t_cnc":"iot_monitor_sub.public.t_cnc"}'
    enable: "on"
  # tables 为 null → 整库模式 (per design.md D1 段)
  # expected_min_rows 未设 → Verify TG 内联默认 1 (per D3 段)
