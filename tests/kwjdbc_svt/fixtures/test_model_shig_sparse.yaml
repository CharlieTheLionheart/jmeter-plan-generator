# shig t_cnc 稀疏大宽表冒烟模型
# 仅保留 t_cnc；4000 个数据列。
# 数值数据列 nullable=true，null_rate=0.99，用于验证 batch_prepared NULL 绑定。

ts_dbs:
  - name: db_shig_sparse
    if_not_exists: true
    retentions: 1d
    partition_interval: 1d
    comment: shig 稀疏大宽表冒烟库
    tables:
      - name: t_cnc
        if_not_exists: true
        with_hash: 4
        retentions: 1d
        comment: 4000 列稀疏数控机床表
        ts_col:
          name: ts
          type: timestamp
          ms_step: 1000
        primary_tag_count: 2
        primary_tags:
          - col_type: varchar(32)
            type_proportion: 0.5
            val_range: "^[A-Z][0-9]{2,4}$"
            seed_num: 50
          - col_type: varchar(32)
            type_proportion: 0.5
            val_range: "enum:op_group_1,op_group_2,op_group_3,op_group_4"
            seed_num: 4
        regular_tag_count: 0
        regular_tags: []
        data_col_count: 4000
        # 沿用 shig t_cnc 的类型构成；比例按原 67 列权重归一化。
        data_cols:
          - col_type: char(30)
            type_proportion: 0.250000000
            val_range: "enum:C0A,C1A,C2A,C3A,C4A"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: char(20)
            type_proportion: 0.191176471
            val_range: "enum:A0B,A1B,A2B,A3B,A4B"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: char(10)
            type_proportion: 0.132352941
            val_range: "enum:M0,M1,M2,M3,M4"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: varchar(100)
            type_proportion: 0.117647059
            val_range: "enum:V0X,V1X,V2X,V3X,V4X"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: varchar(200)
            type_proportion: 0.088235294
            val_range: "enum:P0Y,P1Y,P2Y,P3Y,P4Y"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: smallint
            type_proportion: 0.044117647
            val_range: "[0,100)"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: varchar(64)
            type_proportion: 0.029411765
            val_range: "enum:Q0Z,Q1Z"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: varchar(500)
            type_proportion: 0.029411765
            val_range: "enum:L0W,L1W"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: varchar(300)
            type_proportion: 0.029411765
            val_range: "enum:N0V,N1V"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: int
            type_proportion: 0.029411765
            val_range: "[0,10000)"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: varchar(2000)
            type_proportion: 0.014705882
            val_range: "enum:R0U"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: varchar(1000)
            type_proportion: 0.014705882
            val_range: "enum:S0T"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: float4
            type_proportion: 0.014705882
            val_range: "[0.0,3000.0)"
            seed_num: 100
            nullable: true
            null_rate: 0.99
          - col_type: char(2)
            type_proportion: 0.014705882
            val_range: "enum:OK,NG"
            seed_num: 100
            nullable: true
            null_rate: 0.99
