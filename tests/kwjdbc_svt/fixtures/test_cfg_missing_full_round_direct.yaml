# write-missing-data 缺整轮 fixture(direct 非 bind)
#
# OpenSpec change ``write-missing-data`` tasks.md §9.4 + design D7
# 用途: ts_count == batch_lines → 缺失触发时该批次零行写入,且**不判为失败**。
# 覆盖 direct 路径的 D7 兜底:整轮无格子时 ``insert_sql`` 置注释串,
# 不产出 ``VALUES`` 为空的非法 INSERT。
#
# model 复用 test_model.yaml(表 iot_monitor.t_cnc,ts_col=ts,ms_step=1000)。

conn_config:
  db_url: jdbc:kaiwudb://127.0.0.1:26257/defaultdb
  db_username: root
  db_password: ""
  conn_pool_size: 4
  device_start: 1
  test_duration: 30

write_config:
  - tbl_name: iot_monitor.t_cnc
    throughput: 1.0
    mode: direct
    batch_lines: 5
    device_per_thread: 2
    num_threads: 1
    missing:
      probability: 1.0
      ts_count: 5
      device_count: 0

query_config:
  - query: "select count(*) from iot_monitor.t_cnc;"
    throughput: 1.0
    num_threads: 1
