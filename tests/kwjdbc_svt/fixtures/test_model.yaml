ts_dbs:
  - name: iot_monitor
    if_not_exists: true
    retentions: 3d
    partition_interval: 1d
    comment: 工业互联网时序监控数据数据库
    tables:
      - name: t_cnc
        if_not_exists: true
        retentions: 3d
        with_hash: 4
        comment: 数控机床表
        ts_col:
          name: ts
          type: timestamp
          ms_step: 1000
        primary_tag_count: 1
        regular_tag_count: 1
        data_col_count: 2
        primary_tags:
          - col_type: varchar(32)
            type_proportion: 1.0
            val_range: "^[A-Z][0-9]{2,4}$"
            seed_num: 50
        regular_tags:
          - col_type: varchar(32)
            type_proportion: 1.0
            val_range: "enum:M1,M2,M3,M4,M5"
            seed_num: 5
        data_cols:
          - col_type: int8
            type_proportion: 0.5
            val_range: ">=0"
            seed_num: 20
          - col_type: float4
            type_proportion: 0.5
            val_range: "[0.0,100.0)"
            seed_num: 20