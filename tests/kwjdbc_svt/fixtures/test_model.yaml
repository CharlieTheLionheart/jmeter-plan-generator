ts_dbs:
  - name: iot_monitor
    tables:
      - name: t_cnc
        data_col_count: 1
        primary_tag_count: 1
        regular_tag_count: 0
        data_cols:
          - col_type: int8
            type_proportion: 1.0
            val_range: "[0,100]"
        primary_tags:
          - col_type: int8
            type_proportion: 1.0
        ts_col:
          name: ts
          type: timestamp
          ms_step: 1000
