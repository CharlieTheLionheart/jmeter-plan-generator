# write-missing-data 缺整轮 fixture
#
# OpenSpec change ``write-missing-data`` tasks.md §7.2 + §9.4
# 用途: ts_count == batch_lines → 缺失触发时该批次零行写入（缺整轮）。
# 该形态合法,不判为写入失败（各路径兜底见 design D7）。

conn_config:
  db_url: jdbc:kaiwudb://127.0.0.1:26257/defaultdb
  db_username: root
  db_password: ""
  conn_pool_size: 4
  device_start: 1
  test_duration: 30

write_config:
  - tbl_name: iot_monitor.t_cnc
    throughput: 1.0
    mode: prepare
    batch_lines: 5
    device_per_thread: 2
    num_threads: 4
    missing:
      probability: 1.0
      ts_count: 5
      device_count: 0

query_config:
  - query: "select count(*) from iot_monitor.t_cnc;"
    throughput: 1.0
    num_threads: 1
