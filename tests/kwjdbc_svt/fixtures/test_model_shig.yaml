# shig 场景等价 test_model.yaml
#
# 与 scenarios/shig/plans/plan.jmx 中除下列用例外的所有用例对应：
#   - tearDown PostThreadGroup 的 SQL1..SQL8 断言 + 模板表删除（已排除）
#   - autocommit=false 的 commit(...) JDBCSampler（已排除）
#   - Kafka pipe 实时订阅（已排除）
#   - 写删循环 ThreadGroup（已排除）
#   - DDL 并发 ThreadGroup（spec 不支持运行时 DDL，已排除；如需 fallback 见下）
#
# 列名映射（spec 自动生成约定名 → shig 语义名）：
#   ptag_varchar_1     ← machine_code           （首个 ptag 注入 ${device_code}）
#   rtag_varchar_1     ← op_group | elect_name  （按表选用）
#   col_float4_1       ← sp_act_speed  (t_cnc)
#   col_float4_1..8    ← vol_a/b/c | cur_a/b/c | infre | pallpower  (t_electmeter)
# 时间戳列：ts（spec 默认；shig 原用 k_timestamp 需改名）
# 关系表：sub_company / factory / workshop（用 batch_insert 初始化）

rel_dbs:
  - name: db_shig_rel
    if_not_exists: true
    comment: shig 场景关系库（元数据：分公司/厂区/车间）
    tables:
      # -------------------------------------------------------
      # sub_company：分公司元数据 (济南分公司 / 北方大区)
      # -------------------------------------------------------
      - name: sub_company
        if_not_exists: true
        comment: 分公司元数据表
        primary_key_count: 1
        primary_keys:
          - col_type: int8
            type_proportion: 1.0
            val_range: "=1"
            seed_num: 1
            nullable: false
        data_col_count: 2
        data_cols:
          - col_type: varchar(64)
            type_proportion: 0.5
            val_range: "enum:济南分公司"
            seed_num: 1
            nullable: false
          - col_type: varchar(64)
            type_proportion: 0.5
            val_range: "enum:北方大区"
            seed_num: 1
            nullable: false

      # -------------------------------------------------------
      # factory：厂区元数据（随机字符串 + FAC 后缀）
      # 注：shig 原用 ${__RandomString(...)}FAC 单值；spec 仅支持
      #     enum / 正则；此处用 enum 取若干候选近似 shig 行为。
      # -------------------------------------------------------
      - name: factory
        if_not_exists: true
        comment: 厂区元数据表
        primary_key_count: 1
        primary_keys:
          - col_type: int8
            type_proportion: 1.0
            val_range: "=1"
            seed_num: 1
            nullable: false
        data_col_count: 1
        data_cols:
          - col_type: varchar(64)
            type_proportion: 1.0
            val_range: "enum:F0FAC,F1FAC,F2FAC,F3FAC,F4FAC"
            seed_num: 5
            nullable: false

      # -------------------------------------------------------
      # workshop：车间元数据（随机字符串 + WS 后缀）
      # -------------------------------------------------------
      - name: workshop
        if_not_exists: true
        comment: 车间元数据表
        primary_key_count: 1
        primary_keys:
          - col_type: int8
            type_proportion: 1.0
            val_range: "=1"
            seed_num: 1
            nullable: false
        data_col_count: 1
        data_cols:
          - col_type: varchar(64)
            type_proportion: 1.0
            val_range: "enum:W0WS,W1WS,W2WS,W3WS,W4WS"
            seed_num: 5
            nullable: false

ts_dbs:
  - name: db_shig
    if_not_exists: true
    retentions: 1d
    partition_interval: 1d
    comment: shig 场景时序库（CNC 机床 + 电表）
    tables:
      # -------------------------------------------------------
      # t_cnc：数控机床
      #   ptag (1) = machine_code → ptag_varchar_1（首个 ptag 注入 ${device_code}）
      #   rtag (1) = op_group     → rtag_varchar_1
      #   data_cols：sp_act_speed (float4)
      # -------------------------------------------------------
      - name: t_cnc
        if_not_exists: true
        with_hash: 4
        retentions: 1d
        comment: 数控机床表（sp_act_speed 主轴转速）
        ts_col:
          name: ts
          type: timestamp
          ms_step: 1000
        primary_tag_count: 1
        regular_tag_count: 1
        data_col_count: 1
        primary_tags:
          - col_type: varchar(32)
            type_proportion: 1.0
            val_range: "^[A-Z][0-9]{2,4}$"
            seed_num: 50
        regular_tags:
          - col_type: varchar(32)
            type_proportion: 1.0
            val_range: "enum:op_group_1,op_group_2,op_group_3,op_group_4"
            seed_num: 4
        data_cols:
          - col_type: float4
            type_proportion: 1.0
            val_range: "[0.0,3000.0)"
            seed_num: 50

      # -------------------------------------------------------
      # t_electmeter：电表
      #   ptag (1) = machine_code → ptag_varchar_1
      #   rtag (1) = elect_name   → rtag_varchar_1
      #   data_cols (8)：vol_a | vol_b | vol_c | cur_a | cur_b | cur_c | infre | pallpower
      #   列序号（spec 自动）：
      #     col_float4_1=vol_a | col_float4_2=vol_b | col_float4_3=vol_c
      #     col_float4_4=cur_a | col_float4_5=cur_b | col_float4_6=cur_c
      #     col_float4_7=infre | col_float4_8=pallpower
      # -------------------------------------------------------
      - name: t_electmeter
        if_not_exists: true
        with_hash: 4
        retentions: 1d
        comment: 电表采集表（电压/电流/频率/有功功率）
        ts_col:
          name: ts
          type: timestamp
          ms_step: 1000
        primary_tag_count: 1
        regular_tag_count: 1
        data_col_count: 8
        primary_tags:
          - col_type: varchar(32)
            type_proportion: 1.0
            val_range: "^[A-Z][0-9]{2,4}$"
            seed_num: 50
        regular_tags:
          - col_type: varchar(32)
            type_proportion: 1.0
            # shig 原始值 'NULL','a023','a011'，用于 IN 列表断言
            val_range: "enum:NULL,a023,a011"
            seed_num: 3
        # 8 个 float4 数据列（col_float4_1..8）；
        # spec 算法：1 个 entry × proportion=1.0 × data_col_count=8 → 8 列
        # 列序号映射固定：vol_a..pallpower
        data_cols:
          - col_type: float4
            type_proportion: 1.0
            val_range: "[0.0,50000.0)"
            seed_num: 50
        data_cols:
          # 8 个 float4 数据列（col_float4_1..8）；spec 算法下
          # 1 个 entry × proportion=1.0 × data_col_count=8 → 8 列。
          # 列序号固定映射：1=vol_a 2=vol_b 3=vol_c 4=cur_a
          # 5=cur_b 6=cur_c 7=infre 8=pallpower
          - col_type: float4
            type_proportion: 1.0
            val_range: "[0.0,50000.0)"
            seed_num: 50
