# col-tag-bind-write 端到端 fixture model
#
# OpenSpec change ``col-tag-bind-write`` (2026-08-05) tasks.md §7.3 +
# 后续 D-18 col-tag-bind-per-group-subsets DCR 修订 fixture.
#
# 设计: 1 张 sparse ts 表 ``iot_monitor.meters`` (col_tag_bind_mode) +
# 1 张 sparse ts 表 ``iot_monitor.t_full`` (mixed 场景全行回退).
# 列数从生产 4000 缩到 10，缩短 seed 生成 + 端到端测试运行时间。
# 10 列已足以覆盖 bind mode 的子集列选取 + hash 分组验证。
#
# D-18 (2026-08-13): bind mode 列子集按 hash group_id offset 取, 10 列
# + col_num_per_tag=5 + num_threads=2 刚好覆盖, group 0 拿前 5 列
# (按字母序), group 1 拿后 5 列 — device_1/device_3 互补写不同列.
# 移除 timestamp 列 (val_range regex 不能生成合法 timestamp 字面量,
# D-18 之前是 NULL 不显 bug, 修后变成 bind 列 → server reject).

ts_dbs:
  - name: iot_monitor
    if_not_exists: true
    retentions: 1d
    comment: col-tag-bind-write smoke 时序库
    tables:
      - name: meters
        if_not_exists: true
        retentions: 1d
        ts_col:
          name: ts
          type: timestamp
          ms_step: 1000
        primary_tag_count: 1
        primary_tags:
          - col_type: varchar(64)
            type_proportion: 1.0
            val_range: "^[a-z]+_[0-9]+$"
            seed_num: 5
        regular_tag_count: 0
        regular_tags: []
        data_col_count: 10
        data_cols:
          - col_type: int8
            type_proportion: 0.10
            val_range: "[0,100)"
            seed_num: 5
          - col_type: int4
            type_proportion: 0.10
            val_range: "[0,1000)"
            seed_num: 5
          - col_type: float4
            type_proportion: 0.10
            val_range: "[0.0,100.0)"
            seed_num: 5
          - col_type: float8
            type_proportion: 0.10
            val_range: "[0.0,1.0)"
            seed_num: 5
          - col_type: varchar(32)
            type_proportion: 0.10
            val_range: "enum:A,B,C,D,E"
            seed_num: 5
          - col_type: varchar(64)
            type_proportion: 0.10
            val_range: "enum:V0,V1,V2,V3,V4"
            seed_num: 5
          - col_type: bool
            type_proportion: 0.10
            val_range: "enum:true,false"
            seed_num: 5
          - col_type: float8
            type_proportion: 0.10
            val_range: "[0.0,1000.0)"
            seed_num: 5
          - col_type: float8
            type_proportion: 0.10
            val_range: "[0.0,5000.0)"
            seed_num: 5
          - col_type: char(10)
            type_proportion: 0.10
            val_range: "enum:K0,K1,K2"
            seed_num: 5
      - name: t_full
        if_not_exists: true
        retentions: 1d
        ts_col:
          name: ts
          type: timestamp
          ms_step: 1000
        primary_tag_count: 1
        primary_tags:
          - col_type: varchar(64)
            type_proportion: 1.0
            val_range: "^[a-z]+_[0-9]+$"
            seed_num: 5
        regular_tag_count: 0
        regular_tags: []
        data_col_count: 10
        data_cols:
          - col_type: int8
            type_proportion: 0.10
            val_range: "[0,100)"
            seed_num: 5
          - col_type: int4
            type_proportion: 0.10
            val_range: "[0,1000)"
            seed_num: 5
          - col_type: float4
            type_proportion: 0.10
            val_range: "[0.0,100.0)"
            seed_num: 5
          - col_type: float8
            type_proportion: 0.10
            val_range: "[0.0,1.0)"
            seed_num: 5
          - col_type: varchar(32)
            type_proportion: 0.10
            val_range: "enum:A,B,C,D,E"
            seed_num: 5
          - col_type: varchar(64)
            type_proportion: 0.10
            val_range: "enum:V0,V1,V2,V3,V4"
            seed_num: 5
          - col_type: bool
            type_proportion: 0.10
            val_range: "enum:true,false"
            seed_num: 5
          - col_type: float8
            type_proportion: 0.10
            val_range: "[0.0,1000.0)"
            seed_num: 5
          - col_type: float8
            type_proportion: 0.10
            val_range: "[0.0,5000.0)"
            seed_num: 5
          - col_type: char(10)
            type_proportion: 0.10
            val_range: "enum:K0,K1,K2"
            seed_num: 5
