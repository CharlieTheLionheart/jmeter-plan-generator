# 稀疏表（SPARSE TABLE）大数据模型 smoke fixture
# 10000 数据列 / sparse 上限 20000 / 9 类等分（按 spec L421-423 排除 nchar/timestamp/timestamptz/geometry/text）
# mode: schemaless + col_tag_bind_mode=true + 500 device，每 device 绑 20 列
# 单 config_parser 解析验证，单 DDL 发射验证，不构成端到端真集群 smoke

ts_dbs:
  - name: db_sparse_svt
    if_not_exists: true
    retentions: 1d
    partition_interval: 1d
    comment: 稀疏表 10000 列 + schemaless bind path fixture
    tables:
      - name: t_meters
        if_not_exists: true
        with_hash: 4
        retentions: 1d
        comment: 10000 列稀疏测量表（schemaless bind path）
        sparse: true
        ts_col:
          name: ts
          type: timestamp
          ms_step: 1000
        primary_tag_count: 1
        primary_tags:
          - col_type: varchar(32)
            type_proportion: 1.0
        regular_tag_count: 0
        regular_tags: []
        data_col_count: 10000
        # 9 类等分（不含 nchar — data_type_mapper 不支持；不含 text/timestamp/timestamptz/geometry —
        # 时序 data_col 与稀疏语义不匹配；不含 char(N<=2)/varchar(>=2000) 以保 seed CSV 体积稳定）
        data_cols:
          - col_type: int2
            type_proportion: 0.111111111
            val_range: "[0,100)"
            seed_num: 100
          - col_type: int4
            type_proportion: 0.111111111
            val_range: "[0,100)"
            seed_num: 100
          - col_type: int8
            type_proportion: 0.111111111
            val_range: "[0,100)"
            seed_num: 100
          - col_type: float4
            type_proportion: 0.111111111
            val_range: "[0.0,1000.0)"
            seed_num: 100
          - col_type: float8
            type_proportion: 0.111111111
            val_range: "[0.0,1000.0)"
            seed_num: 100
          - col_type: bool
            type_proportion: 0.111111111
            val_range: "enum:true,false"
            seed_num: 2
          - col_type: char(10)
            type_proportion: 0.111111111
            val_range: "enum:A0,B1,C2,D3,E4"
            seed_num: 5
          - col_type: varchar(64)
            type_proportion: 0.111111111
            val_range: "enum:V0X,V1X,V2X,V3X,V4X"
            seed_num: 5
          - col_type: nvarchar(64)
            type_proportion: 0.111111111
            val_range: "enum:N0V,N1V,N2V"
            seed_num: 3
