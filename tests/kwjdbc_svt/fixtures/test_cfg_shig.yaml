# shig 场景抽象等价 test_cfg.yaml
#
# 列名全部由 spec 自动生成（ptag_*/rtag_*/col_*），不绑定 shig 业务语义。
# 列固定映射（spec 算法 + 列序号）：
#   t_cnc:        ts, ptag_varchar_1, rtag_varchar_1, col_float4_1
#   t_electmeter: ts, ptag_varchar_1, rtag_varchar_1, col_float4_1..8
# 排除用例（按需求）：tearDown 断言、显式 commit、Kafka pipe、
# 写删循环、运行时 DDL 并发。

conn_config:
  db_url: jdbc:kaiwudb://127.0.0.1:26257/defaultdb
  db_username: root
  db_password: ""
  conn_pool_size: 4
  device_start: 1
  test_duration: 30

write_config:
  - tbl_name: db_shig.t_cnc
    throughput: 120.0
    mode: batch_prepared
    batch_lines: 50
    device_per_thread: 1
    num_threads: 4
  - tbl_name: db_shig.t_electmeter
    throughput: 120.0
    mode: batch_prepared
    batch_lines: 50
    device_per_thread: 1
    num_threads: 4

query_config:

  # Q1: sp_act_speed (按 op_group + machine_code + 时间窗)
  - query: >-
      SELECT ts, col_float4_1
      FROM db_shig.t_cnc
      WHERE ptag_varchar_2 = ?
        AND ptag_varchar_1 = ?
        AND ts > NOW() - INTERVAL '1 hour'
      ORDER BY ts DESC
      LIMIT 100
    throughput: 4.0
    num_threads: 1

  # Q2: last_row t_cnc
  - query: >-
      SELECT last_row(*)
      FROM db_shig.t_cnc
      WHERE ptag_varchar_1 = ?
    throughput: 2.0
    num_threads: 1

  # Q3: last_row t_electmeter
  - query: >-
      SELECT last_row(*)
      FROM db_shig.t_electmeter
      WHERE ptag_varchar_1 = ?
      GROUP BY ptag_varchar_1
    throughput: 2.0
    num_threads: 1

  # Q4: max/min/avg cur_a (col_float4_4)
  - query: >-
      SELECT ptag_varchar_1,
             max(col_float4_4) AS max_cur,
             min(col_float4_4) AS min_cur,
             avg(col_float4_4) AS avg_cur
      FROM db_shig.t_electmeter
      WHERE ptag_varchar_1 = ?
        AND rtag_varchar_1 = ?
      GROUP BY ptag_varchar_1
      ORDER BY ptag_varchar_1 ASC
    throughput: 1.0
    num_threads: 1

  # Q5: elect_name IN & group
  - query: >-
      SELECT rtag_varchar_1, count(*) AS cnt
      FROM db_shig.t_electmeter
      WHERE ptag_varchar_1 = ?
        AND rtag_varchar_1 IN ('NIL','a023','a011')
        AND col_float4_7 > 49.8 AND col_float4_7 < 50.2
      GROUP BY rtag_varchar_1
      ORDER BY rtag_varchar_1 ASC
    throughput: 1.0
    num_threads: 1

  # Q6: querypage
  - query: >-
      SELECT ts, ptag_varchar_1,
             col_float4_4, col_float4_5, col_float4_6
      FROM db_shig.t_electmeter
      WHERE 1=1
        AND ts > NOW() - INTERVAL '1 hour'
      ORDER BY ts DESC, ptag_varchar_1 ASC
      LIMIT 100
      OFFSET 0
    throughput: 1.0
    num_threads: 1

  # Q7: sumpower
  - query: >-
      SELECT sum(col_float4_8) AS sumpallpower,
             count(1) AS countall
      FROM db_shig.t_electmeter
      WHERE 1=1
        AND ts > NOW() - INTERVAL '1 hour'
    throughput: 1.0
    num_threads: 1

  # Q8: voltage unbalance (LLM1)
  - query: >-
      SELECT ptag_varchar_1,
             COUNT(*) AS unbalance_count,
             MAX(ABS(col_float4_1 - col_float4_2)) AS max_diff_ab,
             MAX(ABS(col_float4_2 - col_float4_3)) AS max_diff_bc
      FROM db_shig.t_electmeter
      WHERE ts > NOW() - INTERVAL '1 hour'
        AND (ABS(col_float4_1 - col_float4_2) > 1
             OR ABS(col_float4_2 - col_float4_3) > 1)
      GROUP BY ptag_varchar_1
      HAVING COUNT(*) > 5
      ORDER BY unbalance_count DESC
      LIMIT 10
    throughput: 0.016666667
    num_threads: 1

  # Q9: cur_a quality (LLM2) - time_bucket + STDDEV
  - query: >-
      SELECT time_bucket(ts, '1m') AS time_bucket,
             ptag_varchar_1,
             STDDEV(col_float4_4) AS cur_a_stddev,
             MAX(col_float4_4) - MIN(col_float4_4) AS cur_a_range
      FROM db_shig.t_electmeter
      WHERE ts > NOW() - INTERVAL '6 hours'
        AND ptag_varchar_1 LIKE '%_%'
      GROUP BY time_bucket, ptag_varchar_1
      HAVING STDDEV(col_float4_4) > 0
      ORDER BY time_bucket DESC, cur_a_stddev DESC
    throughput: 0.016666667
    num_threads: 1

  # Q10: cnc status + energy consumption (LLM3) - JOIN t_cnc/t_electmeter
  # device_state 用抽象列 col_float4_1 替代
  - query: >-
      SELECT c.ts         AS cnc_time,
             e.ts         AS meter_time,
             c.ptag_varchar_1,
             c.col_float4_1 AS device_state,
             e.col_float4_4,
             e.col_float4_8
      FROM (
        SELECT ts, ptag_varchar_1, col_float4_1
        FROM db_shig.t_cnc
        WHERE ptag_varchar_1 = ?
          AND ts > NOW() - INTERVAL '1 hour'
      ) c
      INNER JOIN (
        SELECT ts, ptag_varchar_1, col_float4_4, col_float4_8
        FROM db_shig.t_electmeter
        WHERE ptag_varchar_1 = ?
      ) e
        ON e.ts BETWEEN c.ts - INTERVAL '500ms' AND c.ts + INTERVAL '500ms'
      ORDER BY c.ts DESC
      LIMIT 100
    throughput: 0.016666667
    num_threads: 2

  # Q11: cur_a healthy status (LLM4) - FILTER + time_bucket
  - query: >-
      SELECT ptag_varchar_1,
             time_bucket(ts, '1m') AS time_window,
             AVG(col_float4_4) FILTER (WHERE col_float4_7 > 49.5 AND col_float4_7 < 50.5) AS norm_avg_cur,
             AVG(col_float4_4) FILTER (WHERE abs(col_float4_7 - 50) >= 0.5) AS abnorm_avg_cur
      FROM db_shig.t_electmeter
      WHERE ts > NOW() - INTERVAL '1 hour'
        AND ptag_varchar_1 = ?
      GROUP BY ptag_varchar_1, time_window
      ORDER BY time_window DESC
      LIMIT 60
    throughput: 0.016666667
    num_threads: 1

  # Q12: electmeter start-end status UNION (LLM5)
  - query: >-
      SELECT 'start' AS point_type,
             ts,
             ptag_varchar_1,
             col_float4_4,
             col_float4_8
      FROM db_shig.t_electmeter
      WHERE ptag_varchar_1 = ?
        AND ts = (
          SELECT MIN(ts)
          FROM db_shig.t_electmeter
          WHERE ptag_varchar_1 = ?
            AND ts > NOW() - INTERVAL '1 hour'
        )
      UNION ALL
      SELECT 'end' AS point_type,
             ts,
             ptag_varchar_1,
             col_float4_4,
             col_float4_8
      FROM db_shig.t_electmeter
      WHERE ptag_varchar_1 = ?
        AND ts = (
          SELECT MAX(ts)
          FROM db_shig.t_electmeter
          WHERE ptag_varchar_1 = ?
            AND ts > NOW() - INTERVAL '1 hour'
        )
    throughput: 0.016666667
    num_threads: 1
